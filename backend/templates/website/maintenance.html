<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ platform.platform_name }}</title>
    <link rel="icon" href="{{ platform.favicon }}">
    <style>body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#f5f8ff;color:#101537;text-align:center;padding:16px}
    img{max-height:56px;margin-bottom:24px}.box{max-width:520px}</style>
</head>
<body>
<div class="box">
    {% if platform.logo_dark %}<img src="{{ platform.logo_dark }}" alt="{{ platform.platform_name }}">{% endif %}
    <div>{{ maintenance_message|safe }}</div>
</div>
</body>
</html>
