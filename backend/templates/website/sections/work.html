{% load static %}
{% regroup c.cards by tab as tabs %}
<div class="work2 _relative">
  <div class="container">
    <div class="row"><div class="col-lg-6 m-auto text-center"><div class="heading9">{% include 'website/sections/_heading.html' %}</div></div></div>
    <div class="row">
      <div class="col-lg-9 m-auto text-center">
        <ul class="nav nav-pills mb-3" role="tablist">
          {% for t in tabs %}
          <li class="nav-item" role="presentation">
            <button class="nav-link{% if forloop.first %} active{% endif %}" id="work-tab-{{ forloop.counter }}" data-bs-toggle="pill"
                    data-bs-target="#work-pane-{{ forloop.counter }}" type="button" role="tab"
                    aria-controls="work-pane-{{ forloop.counter }}" aria-selected="{{ forloop.first|yesno:'true,false' }}"
                    title="{{ t.grouper }}" aria-label="{{ t.grouper|default:forloop.counter }}">{{ forloop.counter }}</button>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <div class="tab-content">
          {% for t in tabs %}
          <div class="tab-pane fade{% if forloop.first %} show active{% endif %}" id="work-pane-{{ forloop.counter }}" role="tabpanel" aria-labelledby="work-tab-{{ forloop.counter }}">
            <div class="row">
              {% for card in t.list %}
              <div class="col-lg-4">
                <div class="tabs-box-item" data-aos="fade-up" data-aos-duration="{% cycle 800 1000 1100 %}">
                  <h3>{{ card.title }}</h3>
                  {% if card.image %}<img src="{{ card.image }}" alt="" loading="lazy">{% endif %}
                </div>
              </div>
              {% endfor %}
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
  <img class="shape1" src="{% static 'website/img/shapes/home2-element1.png' %}" alt="" loading="lazy">
  <img class="shape2" src="{% static 'website/img/shapes/home2-element2.png' %}" alt="" loading="lazy">
</div>
<div class="space40"></div>
