<div class="about-boxs sp">
  <div class="container">
    {% if c.heading or c.badge_text %}
    <div class="row"><div class="col-lg-7 m-auto text-center"><div class="heading9">
      {% include 'website/sections/_heading.html' %}
      {% if c.intro %}<div class="space16"></div><p>{{ c.intro }}</p>{% endif %}
    </div></div></div>
    <div class="space40"></div>
    {% endif %}
    <div class="row">
      {% for card in c.cards %}
      <div class="col-lg-{% if c.cards|length == 4 %}3{% else %}4{% endif %} col-md-6 mb-4">
        <div class="single-box h-100" data-aos="fade-up" data-aos-duration="{% cycle 800 1000 1200 1400 %}">
          {% if card.icon %}<div class="icon"><img src="{{ card.icon }}" alt="" loading="lazy"></div>{% endif %}
          <div class="headding2">
            <h3 class="h5">{% if card.url %}<a href="{{ card.url }}">{{ card.title }}</a>{% else %}{{ card.title }}{% endif %}</h3>
            <p>{{ card.text }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
