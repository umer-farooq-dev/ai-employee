<div class="hr-solutions">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-7">{% if c.image %}<div class="image"><img src="{{ c.image }}" alt="" loading="lazy"></div>{% endif %}</div>
      <div class="col-lg-5">
        <div class="heading9">
          {% include 'website/sections/_heading.html' %}
          {% if c.paragraph %}<div class="space16"></div><p data-aos="fade-left" data-aos-duration="700">{{ c.paragraph }}</p>{% endif %}
          {% if c.button.label %}<div class="space30"></div>
          <div data-aos="fade-left" data-aos-duration="1000"><a href="{{ c.button.url }}" class="theme-btn15">{{ c.button.label }} <span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span></a></div>{% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
<div class="space60"></div>
