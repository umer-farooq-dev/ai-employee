<style>
.tk-status{display:inline-flex;font-size:.72rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;background:var(--bs-tertiary-bg);color:var(--bs-secondary-color);white-space:nowrap}
.tk-status.open,.tk-status.waiting{background:#e0f2fe;color:#0369a1}.tk-status.answered{background:#fef3c7;color:#b45309}
.tk-status.resolved{background:#dcfce7;color:#15803d}
.tk-prio{font-size:.72rem;font-weight:600;color:var(--bs-secondary-color)}.tk-prio.high{color:#b45309}.tk-prio.urgent{color:#b91c1c}
.tk-row{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 1.1rem;border-bottom:1px solid var(--bs-border-color);color:inherit;text-decoration:none}
.tk-row:hover{background:var(--bs-tertiary-bg);color:inherit}
.tk-row .main{min-width:0;flex:1}.tk-row .sub{font-size:.78rem;color:var(--bs-secondary-color)}
.tk-thread{display:flex;flex-direction:column;gap:1rem}
.tk-msg{max-width:min(720px,92%);border:1px solid var(--bs-border-color);border-radius:.75rem;padding:.8rem 1rem;background:var(--bs-body-bg)}
.tk-msg.mine{align-self:flex-end;background:color-mix(in srgb,var(--brand-primary) 7%,var(--bs-body-bg));border-color:color-mix(in srgb,var(--brand-primary) 25%,var(--bs-border-color))}
.tk-msg.note{background:#fffbeb;border-color:#fde68a}
.tk-msg .who{font-size:.78rem;color:var(--bs-secondary-color);margin-bottom:.35rem;display:flex;justify-content:space-between;gap:.75rem}
.tk-msg .body{white-space:pre-wrap;word-break:break-word;font-size:.9rem}
.tk-msg .file{display:inline-flex;gap:.35rem;align-items:center;margin-top:.5rem;font-size:.8rem}
</style>
