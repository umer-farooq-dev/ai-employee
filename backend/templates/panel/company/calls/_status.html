<span class="badge {% if call.status == 'completed' or call.status == 'transferred' %}bg-success-subtle text-success{% elif call.status == 'in_progress' or call.status == 'ringing' or call.status == 'transferring' %}bg-primary-subtle text-primary{% elif call.status == 'queued' %}bg-light text-dark{% elif call.status == 'failed' %}bg-danger-subtle text-danger{% else %}bg-warning-subtle text-warning{% endif %}">{{ call.get_status_display }}</span>{% if call.status == 'queued' and call.next_retry_at %}<div class="small text-muted">at {{ call.next_retry_at|date:"d M H:i" }}</div>{% endif %}
