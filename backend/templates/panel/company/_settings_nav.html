{# Company settings tabs; `active` = company | crm | calling | whatsapp #}
{% load panel_tags %}{% company_can "whatsapp.manage" as wa_manage %}
<div class="d-flex flex-wrap gap-2 mt-3">
    <a class="btn btn-sm {% if active == 'company' %}btn-primary{% else %}btn-light{% endif %}" href="{% url 'panel:company_settings' %}">Company</a>
    <a class="btn btn-sm {% if active == 'crm' %}btn-primary{% else %}btn-light{% endif %}" href="{% url 'panel:crm_settings' %}">CRM fields, scoring &amp; assignment</a>
    <a class="btn btn-sm {% if active == 'calling' %}btn-primary{% else %}btn-light{% endif %}" href="{% url 'panel:calling_settings' %}">Calling &amp; numbers</a>
    {% if wa_manage %}<a class="btn btn-sm {% if active == 'whatsapp' %}btn-primary{% else %}btn-light{% endif %}" href="{% url 'panel:whatsapp_settings' %}">WhatsApp</a>{% endif %}
</div>
