<style>
.an-filters{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.an-filters .btn-check:checked+.btn{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff}
.an-custom{display:flex;align-items:center;gap:.4rem}
.an-custom.d-none{display:none!important}
.an-custom input{width:auto;min-width:0}
.an-employee{width:auto;max-width:100%}
.an-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
@media (min-width:992px){.an-kpis.nine{grid-template-columns:repeat(3,minmax(0,1fr))}}
.an-kpi{display:flex;gap:.85rem;align-items:center;padding:1rem 1.1rem;border:1px solid var(--bs-border-color);border-radius:.6rem;background:var(--bs-body-bg);color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s;min-width:0}
a.an-kpi:hover{border-color:var(--brand-primary);box-shadow:0 2px 10px rgba(15,23,42,.06);color:inherit}
.an-kpi .ico{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:color-mix(in srgb,var(--brand-primary) 10%,transparent);color:var(--brand-primary);font-size:22px}
.an-kpi .lbl{font-size:.8rem;color:var(--bs-secondary-color)}
.an-kpi .val{font-size:1.45rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.an-kpi .hint{font-size:.75rem;color:var(--bs-secondary-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-kpi .txt{min-width:0}
.an-live{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--bs-secondary-color)}
.an-live i{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:an-pulse 2s infinite}
.an-live.off i{background:#94a3b8;animation:none}
@keyframes an-pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.an-chart{min-height:300px}
.an-chart.sm{min-height:240px}
.an-table th{font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:var(--bs-secondary-color);font-weight:600;white-space:nowrap}
.an-table td{font-variant-numeric:tabular-nums;white-space:nowrap}
.an-funnel{display:flex;flex-direction:column;gap:.45rem}
.an-step{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:.6rem;font-size:.85rem}
.an-step .bar{height:22px;border-radius:6px;background:var(--bs-tertiary-bg);overflow:hidden}
.an-step .bar span{display:block;height:100%;border-radius:6px;background:var(--brand-primary);opacity:.85;min-width:2px}
.an-step .num{text-align:right;font-variant-numeric:tabular-nums}
.an-step .num small{color:var(--bs-secondary-color)}
@media (max-width:575.98px){
  .an-kpis,.an-kpis.nine{grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
  .an-filters{width:100%}
  .an-kpi{padding:.75rem;gap:.5rem;flex-direction:column;align-items:flex-start}
  .an-kpi .hint{white-space:normal}
  .an-kpi .ico{width:36px;height:36px;font-size:18px;border-radius:10px}
  .an-kpi .val{font-size:1.2rem}
  .an-ranges{width:100%;display:flex}
  .an-ranges .btn{flex:1;padding-left:.2rem;padding-right:.2rem;white-space:nowrap;font-size:.72rem}
  .an-custom{width:100%}
  .an-custom input{flex:1}
  .an-employee{width:100%}
  .an-step{grid-template-columns:84px 1fr 56px}
}
</style>
