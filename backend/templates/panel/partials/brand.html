{# Logos from General Settings (SA-22 / SA-23) #}
<div class="brand">
    <a href="{{ home_url|default:'#' }}" class="logo">
        <span><img src="{{ platform.logo_small }}" alt="{{ platform.platform_name }}" class="logo-sm"></span>
        <span>
            <img src="{{ platform.logo_light }}" alt="{{ platform.platform_name }}" class="logo-lg logo-light">
            <img src="{{ platform.logo_dark }}" alt="{{ platform.platform_name }}" class="logo-lg logo-dark">
        </span>
    </a>
</div>
