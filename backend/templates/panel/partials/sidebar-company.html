{# Company panel menu: grows phase by phase (PRD-01 CP-02). Only screens that exist are listed. #}
<div class="startbar d-print-none">
    {% url 'panel:company_home' as home_url %}
    {% include 'panel/partials/brand.html' with home_url=home_url %}
    <div class="startbar-menu">
        <div class="startbar-collapse" id="startbarCollapse" data-simplebar>
            <div class="d-flex align-items-start flex-column w-100">
                <ul class="navbar-nav mb-auto w-100">
                    <li class="menu-label pt-0 mt-0"><span>{{ request.company.name|default:"Main Menu" }}</span></li>
                    <li class="nav-item"><a class="nav-link" href="{{ home_url }}"><i class="iconoir-home-simple menu-icon"></i><span>Dashboard</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'panel:profile' %}"><i class="iconoir-user menu-icon"></i><span>My Profile</span></a></li>
                </ul>
            </div>
        </div>
    </div>
</div>
