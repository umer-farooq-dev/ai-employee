{% if f %}
<div class="col-lg-{{ col|default:12 }}">
  <div class="single-inputs">
    <label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %}*{% endif %}</label>
    {{ f }}
    {% for e in f.errors %}<div class="text-danger small field-error">{{ e }}</div>{% endfor %}
  </div>
</div>
{% endif %}
