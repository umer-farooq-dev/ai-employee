name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aiemployee
          POSTGRES_USER: aiemployee
          POSTGRES_PASSWORD: aiemployee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiemployee" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://aiemployee:aiemployee@localhost:5432/aiemployee
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      # Voice Gateway first, then the web pins on top (Pillow 13 over pipecat's Pillow<13, see voice.txt) — as in the image
      - run: pip install -r backend/requirements/voice.txt
      - run: pip install -r backend/requirements/dev.txt
      - name: Lint
        run: |
          ruff check backend poc
          black --check backend poc
      - name: Migrations are up to date
        run: python backend/manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests
        run: |
          pytest
          python poc/voice_bakeoff.py --selftest
          cd poc && python ai_extraction.py --selftest
      - name: Security - code
        run: bandit -q -r backend/apps backend/config -x '*/tests/*,*/migrations/*'
      - name: Security - dependencies
        run: pip-audit -r backend/requirements/base.txt
      - name: Security - secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Production settings pass the deployment checks
        run: |
          python backend/manage.py check --deploy 2>&1 | grep -v drf_spectacular | tee /tmp/deploy.txt
          ! grep -E "\((security|django)\.[WE][0-9]+\)" /tmp/deploy.txt
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only-deploy-check-ci-only-deploy-check-ci-only-deploy-check
          FIELD_ENCRYPTION_KEY: ci-only-field-key
          ALLOWED_HOSTS: example.com

  # ENGR-04 / SEC-15: build both images, scan them, and boot the production stack end to end
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build --target web -t aiemployee-web:ci .
          docker build --target voice -t aiemployee-voice:ci .
      - name: Security - container scan (Trivy)
        run: |
          for image in aiemployee-web:ci aiemployee-voice:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - name: Production stack smoke test
        working-directory: deploy
        run: |
          key() { python3 -c "import secrets; print(secrets.token_urlsafe(48))"; }
          PG=$(key); APP=$(key); RD=$(key)
          cat > .env <<EOF
          ENVIRONMENT=staging
          DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          SECRET_KEY=$(key)$(key)
          FIELD_ENCRYPTION_KEY=$(key)
          ALLOWED_HOSTS=localhost,www.localhost,admin.localhost
          CSRF_TRUSTED_ORIGINS=https://localhost,https://admin.localhost
          ADMIN_HOST=admin.localhost
          PUBLIC_BASE_URL=https://localhost
          VOICE_GATEWAY_URL=wss://voice.localhost
          VOICE_GATEWAY_BIND=0.0.0.0:8765
          POSTGRES_DB=aiemployee
          POSTGRES_USER=aiemployee
          POSTGRES_PASSWORD=$PG
          APP_DB_USER=aiemployee_app
          APP_DB_PASSWORD=$APP
          OWNER_DATABASE_URL=postgres://aiemployee:$PG@db:5432/aiemployee
          DATABASE_URL=postgres://aiemployee_app:$APP@db:5432/aiemployee
          REDIS_PASSWORD=$RD
          REDIS_URL=redis://:$RD@redis:6379/0
          EMAIL_URL=consolemail://
          EOF
          sed -i 's/^ *//' .env
          export IMAGE_WEB=aiemployee-web:ci IMAGE_VOICE=aiemployee-voice:ci
          docker compose -f docker-compose.prod.yml --env-file .env up -d --no-build
          for i in $(seq 1 60); do
            curl -skf --resolve localhost:443:127.0.0.1 https://localhost/healthz/ && break; sleep 5
          done
          set -x
          curl -skf --resolve localhost:443:127.0.0.1 https://localhost/healthz/ | grep '"database": "ok"'
          curl -skf --resolve localhost:443:127.0.0.1 https://localhost/ -o /dev/null
          curl -skf --resolve localhost:443:127.0.0.1 https://localhost/static/webchat/widget.js -o /dev/null  # theme assets are not in git
          test "$(curl -sk --resolve admin.localhost:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://admin.localhost/superadmin/)" = 302
          curl -s --resolve localhost:80:127.0.0.1 -o /dev/null -w '%{http_code}\n' http://localhost/ | grep -E '30[18]'
          for i in $(seq 1 30); do
            curl -skf --resolve voice.localhost:443:127.0.0.1 https://voice.localhost/healthz && break; sleep 5
          done
          docker compose -f docker-compose.prod.yml --env-file .env exec -T web python manage.py run_scheduler --once
          docker compose -f docker-compose.prod.yml --env-file .env ps
      - name: Backup restore drill (SEC-10, ENGR-08)
        working-directory: deploy
        run: sh restore_drill.sh docker-compose.prod.yml
      - name: Load test (k6, ENGR-07) — regression gate on the CI runner; launch targets are run on staging
        working-directory: deploy
        run: |
          export LOADTEST_PASSWORD=$(python3 -c "import secrets; print(secrets.token_urlsafe(18))")
          docker compose -f docker-compose.prod.yml --env-file .env exec -T -e LOADTEST_PASSWORD -e LOADTEST_COMPANIES=10 \
            web python manage.py shell -c "import sys; exec(sys.stdin.read())" < loadtest/setup.py
          mkdir -p ../k6 && chmod 777 ../k6
          docker run --rm --network host -v "$PWD/loadtest:/scripts" -v "$PWD/../k6:/out" \
            -e BASE=https://localhost -e PASSWORD="$LOADTEST_PASSWORD" -e COMPANIES=10 -e VUS=30 -e HOLD=90s \
            grafana/k6:0.54.0 run --quiet --summary-export /out/k6-summary.json /scripts/api.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: k6-summary, path: k6/, if-no-files-found: ignore}
      - name: Security - DAST (OWASP ZAP baseline on the running stack)
        run: |
          mkdir -p zap && chmod 777 zap
          for target in https://localhost/ https://admin.localhost/superadmin/; do
            name=$(echo "$target" | cut -d/ -f3 | cut -d. -f1)
            docker run --rm --network host --add-host admin.localhost:127.0.0.1 -v "$PWD/zap:/zap/wrk" \
              ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$target" -m 3 -I \
              -r "zap-$name.html" -J "zap-$name.json" || true
          done
          # the gate: no High risk alert on any target
          python3 - <<'EOF'
          import glob, json, sys
          high = [(f, a["name"]) for f in glob.glob("zap/zap-*.json") for s in json.load(open(f))["site"]
                  for a in s["alerts"] if a["riskcode"] == "3"]
          print("\n".join(f"{f}: {n}" for f, n in high) or "No high-risk alerts")
          sys.exit(1 if high else 0)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: zap-reports, path: zap/, if-no-files-found: ignore}
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose -f docker-compose.prod.yml --env-file .env logs --tail 80
