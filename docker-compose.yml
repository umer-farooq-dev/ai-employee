# Local development services. Start with: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aiemployee
      POSTGRES_USER: aiemployee
      POSTGRES_PASSWORD: aiemployee
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  mailpit:  # catches all outgoing email; UI at http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  freellmapi:  # free LLM tiers behind one OpenAI-compatible /v1 endpoint; dashboard at http://localhost:3001
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    environment:
      PORT: 3001
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY}
    ports: ["127.0.0.1:3001:3001"]
    volumes: [freellmapi-data:/app/server/data]
    profiles: ["ai"]  # start with: docker compose --profile ai up -d

  db-backup:  # SEC-10: daily compressed pg_dump; copy ./backups off-site. PITR is configured on the client's hosting (Phase 8)
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: db
      PGUSER: aiemployee
      PGPASSWORD: aiemployee
      PGDATABASE: aiemployee
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ["./backups:/backups"]
    entrypoint: ["sh", "-c", "while true; do pg_dump -Fc > /backups/db-$$(date +%Y%m%d-%H%M).dump && find /backups -name 'db-*.dump' -mtime +$$KEEP_DAYS -delete; sleep 86400; done"]
    depends_on: [db]
    profiles: ["backup"]  # start with: docker compose --profile backup up -d

volumes:
  pgdata:
  freellmapi-data:
