# Website, company panel, REST API and the Super Admin host (admin.<domain> is an alias of the same site).
# Plesk: Websites & Domains → <domain> → Apache & nginx Settings → "Proxy mode" off → Additional nginx directives.
# Plain nginx: put these lines inside the server block of <domain> and admin.<domain>.
client_max_body_size 60m;

location ^~ /static/ {
    alias /opt/ai-employee/app/staticfiles/;
    expires 7d;
}

location ^~ /media/ {
    alias /opt/ai-employee/app/media/;
    add_header X-Content-Type-Options nosniff;
}

location ~ ^/ {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}
